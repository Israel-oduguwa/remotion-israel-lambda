name: Deploy Remotion Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-remotion-lambda.yml"
      - "remotion.config.ts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      REMOTION_AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Lint
        run: npm run lint

      - name: Deploy Remotion Lambda
        run: npm run lambda:deploy

      - name: Commit deployment manifest
        run: |
          git status --short deployment/remotion-lambda.json

          if git diff --quiet -- deployment/remotion-lambda.json && git diff --cached --quiet -- deployment/remotion-lambda.json && git ls-files --error-unmatch deployment/remotion-lambda.json >/dev/null 2>&1; then
            echo "Deployment manifest unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/remotion-lambda.json
          if git diff --cached --quiet -- deployment/remotion-lambda.json; then
            echo "No deployment manifest changes to commit."
            exit 0
          fi
          git commit -m "Update Remotion Lambda deployment manifest"
          git push

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: remotion-lambda-deployment
          path: deployment/remotion-lambda.json
